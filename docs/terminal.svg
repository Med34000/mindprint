  <text x="22" y="80" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13.5" fill="#a6e3a1">$&#160;pip&#160;install&#160;.</text><text x="22" y="101" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13.5" fill="#a6e3a1">$&#160;mindprint&#160;demo_chatgpt/&#160;demo_claude/&#160;-o&#160;my-profile</text><text x="22" y="122" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13.5" fill="#cdd6f4">✅&#160;Parsed&#160;499&#160;conversations&#160;(1396&#160;user&#160;messages,&#160;1097&#160;assistant&#160;replies)</text><text x="22" y="143" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13.5" fill="#89b4fa">&#160;&#160;&#160;•&#160;chatgpt:&#160;369&#160;conversations,&#160;1026&#160;user&#160;messages</text><text x="22" y="164" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13.5" fill="#89b4fa">&#160;&#160;&#160;•&#160;claude:&#160;130&#160;conversations,&#160;370&#160;user&#160;messages</text><text x="22" y="185" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13.5" fill="#89b4fa">&#160;&#160;&#160;JSON:&#160;/tmp/tmpo1bo_k0o/out/mindprint.json</text><text x="22" y="206" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13.5" fill="#89b4fa">&#160;&#160;&#160;Markdown:&#160;/tmp/tmpo1bo_k0o/out/mindprint.md</text><text x="22" y="227" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13.5" fill="#bac2de">&#160;&#160;&#160;Memory&#160;file:&#160;/tmp/tmpo1bo_k0o/out/memory-file.md&#160;&#160;←&#160;paste&#160;into&#160;your&#160;AI&#x27;s&#160;system&#160;context</text><text x="22" y="248" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13.5" fill="#bac2de"></text><text x="22" y="269" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13.5" fill="#a6e3a1">$&#160;head&#160;-18&#160;my-profile/memory-file.md</text><text x="22" y="290" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13.5" fill="#f5c2e7">#&#160;User&#160;memory&#160;file</text><text x="22" y="311" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13.5" fill="#bac2de"></text><text x="22" y="332" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13.5" fill="#bac2de">Statistical&#160;self-profile&#160;distilled&#160;from&#160;the&#160;user&#x27;s&#160;own&#160;AI&#160;exports&#160;(499&#160;conversations,&#160;1396&#160;of&#160;their&#160;messages,&#160;2023-03-03&#160;→&#160;2026-07-07).&#160;Generated&#160;locally&#160;by&#160;mindprint&#160;on&#160;2026-09-02T19:07:47+00:00.&#160;Facts&#160;may&#160;be&#160;stale&#160;after&#160;that&#160;date&#160;—&#160;verify&#160;time-sensitive&#160;details&#160;with&#160;the&#160;user.</text><text x="22" y="353" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13.5" fill="#bac2de"></text><text x="22" y="374" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13.5" fill="#f5c2e7">##&#160;Communication</text><text x="22" y="395" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13.5" fill="#bac2de"></text><text x="22" y="416" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13.5" fill="#bac2de">-&#160;Primary&#160;language:&#160;English&#160;(~100%)</text><text x="22" y="437" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13.5" fill="#bac2de">-&#160;Writes&#160;short,&#160;directive&#160;messages&#160;(median&#160;52&#160;chars)</text><text x="22" y="458" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13.5" fill="#bac2de"></text><text x="22" y="479" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13.5" fill="#f5c2e7">##&#160;Active&#160;projects&#160;(most&#160;recent&#160;first)</text><text x="22" y="500" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13.5" fill="#bac2de"></text><text x="22" y="521" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13.5" fill="#bac2de">-&#160;**Freelance&#160;admin:&#160;client**&#160;—&#160;last&#160;active&#160;2026-03-02</text><text x="22" y="542" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13.5" fill="#bac2de">-&#160;**Freelance&#160;admin:&#160;client**&#160;—&#160;last&#160;active&#160;2026-03-02</text><text x="22" y="563" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13.5" fill="#bac2de">-&#160;**Freelance&#160;admin:&#160;client**&#160;—&#160;last&#160;active&#160;2024-08-23</text><text x="22" y="584" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13.5" fill="#bac2de">-&#160;**Freelance&#160;admin:&#160;quote**&#160;—&#160;last&#160;active&#160;2024-03-17</text><text x="22" y="605" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13.5" fill="#bac2de">-&#160;**Freelance&#160;admin:&#160;quote**&#160;—&#160;last&#160;active&#160;2024-03-17</text><text x="22" y="626" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13.5" fill="#bac2de">-&#160;**Freelance&#160;admin:&#160;client**&#160;—&#160;last&#160;active&#160;2024-01-21</text><text x="22" y="647" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13.5" fill="#bac2de">-&#160;**Freelance&#160;admin:&#160;client**&#160;—&#160;last&#160;active&#160;2024-01-21</text>
