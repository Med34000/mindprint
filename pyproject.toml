[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mindprint"
version = "0.1.0"
description = "Turn your AI chat exports (ChatGPT, Claude) into a structured self-profile — 100% local, nothing leaves your machine."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Med34000" }]
keywords = ["privacy", "chatgpt", "claude", "data-export", "self-profile", "local-first"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mindprint = "mindprint.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
